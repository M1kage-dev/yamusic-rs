# Каждый push и PR: clippy, тесты и сборки в артефактах: exe для Windows, .deb, .rpm и
# AppImage для Linux.
# Тег v* (например v1.0.1): то же и релиз со всеми файлами. Его создаёт отдельное задание
# после обеих сборок. Встроенная обновлялка на Windows ищет в релизе yamusic-rs.exe.
name: Сборка

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Тег совпадает с версией в Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Тег $GITHUB_REF_NAME, а в Cargo.toml версия $v"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release
      - run: cargo build --release

      - name: SHA-256
        shell: pwsh
        run: (Get-FileHash target/release/yamusic-rs.exe -Algorithm SHA256).Hash.ToLower()

      # Без zip: из артефактов скачивается сразу yamusic-rs.exe.
      - uses: actions/upload-artifact@v7
        with:
          path: target/release/yamusic-rs.exe
          archive: false

  # Ubuntu 22.04 — самая старая glibc (2.35) среди поддерживаемых: собранное здесь
  # запускается и на ней, и на всех более новых дистрибутивах.
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Зависимости сборки
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libasound2-dev libfontconfig1-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libx11-xcb-dev \
            libxcursor-dev libxi-dev libxrandr-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release
      - run: cargo build --release

      - name: Пакеты
        id: pkg
        run: |
          command -v cargo-deb >/dev/null || cargo install --locked cargo-deb
          command -v cargo-generate-rpm >/dev/null || cargo install --locked cargo-generate-rpm
          tools/appimage.sh
          cargo deb --no-build
          cargo generate-rpm
          echo "deb=$(ls target/debian/*.deb)" >> "$GITHUB_OUTPUT"
          echo "rpm=$(ls target/generate-rpm/*.rpm)" >> "$GITHUB_OUTPUT"

      - name: SHA-256
        run: sha256sum target/release/yamusic-rs target/appimage/*.AppImage ${{ steps.pkg.outputs.deb }} ${{ steps.pkg.outputs.rpm }}

      # По файлу на артефакт: без zip каждый скачивается как есть.
      - uses: actions/upload-artifact@v7
        with:
          path: target/appimage/yamusic-rs-x86_64.AppImage
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.pkg.outputs.deb }}
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.pkg.outputs.rpm }}
          archive: false

  # macOS: две архитектуры одним универсальным бинарём. Тесты и clippy — один раз,
  # сборка и упаковка — через tools/macos-app.sh, он же собирает universal через lipo.
  # macos-latest — всегда доступная метка Apple Silicon; конкретную версию (macos-14)
  # GitHub снимает с раннеров, и job отменяется, не начавшись.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Тег совпадает с версией в Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Тег $GITHUB_REF_NAME, а в Cargo.toml версия $v"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      # Значок рендерится из SVG: без librsvg скрипт соберёт его из готового 256 px.
      - name: librsvg для значка
        run: brew install librsvg

      # Сертификат подписи: с ним личность приложения постоянна и связка ключей не спрашивает
      # доступ к токену после каждого обновления. Секретов нет — соберём ad-hoc.
      - name: Сертификат подписи
        env:
          SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
        run: |
          if [ -z "$SIGN_P12" ]; then
            echo "секрета с сертификатом нет — подпишу ad-hoc"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/sign.keychain"
          echo "$SIGN_P12" | base64 -D > "$RUNNER_TEMP/sign.p12"
          security create-keychain -p ci-sign "$KEYCHAIN"
          security unlock-keychain -p ci-sign "$KEYCHAIN"
          security import "$RUNNER_TEMP/sign.p12" -k "$KEYCHAIN" -P "$SIGN_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci-sign "$KEYCHAIN" > /dev/null
          rm -f "$RUNNER_TEMP/sign.p12"


      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release

      - name: Бандл и .dmg
        env:
          YM_SIGN_KEYCHAIN: ${{ secrets.MACOS_SIGN_P12 != '' && format('{0}/sign.keychain', runner.temp) || '' }}
          YM_SIGN_REQUIRED: ${{ secrets.MACOS_SIGN_P12 != '' && '1' || '0' }}
        run: |
          # Связку могли залочить, пока шла сборка: перед подписью разблокируем ещё раз.
          if [ -n "$YM_SIGN_KEYCHAIN" ]; then
            security set-keychain-settings -lut 21600 "$YM_SIGN_KEYCHAIN"
            security unlock-keychain -p ci-sign "$YM_SIGN_KEYCHAIN"
          fi
          tools/macos-app.sh --universal --dmg

      - name: Проверка подписи и архитектур
        run: |
          codesign --verify --deep --strict "target/macos/Яндекс Музыка RS.app"
          echo "подпись: $(codesign -dvv "target/macos/Яндекс Музыка RS.app" 2>&1 | grep -E 'Authority|Signature=' | tr '\n' ' ')"
          echo "архитектуры: $(lipo -archs "target/macos/Яндекс Музыка RS.app/Contents/MacOS/yamusic-rs")"
          lipo -archs "target/macos/Яндекс Музыка RS.app/Contents/MacOS/yamusic-rs" | grep -q x86_64

      - name: SHA-256
        run: shasum -a 256 target/macos/*.dmg

      - uses: actions/upload-artifact@v7
        with:
          path: target/macos/yamusic-rs-*-macos.dmg
          archive: false

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Описание релиза — раздел из CHANGELOG.md. Нет раздела — релиз не собираем:
      # так история изменений не отстаёт от тегов.
      - name: Заметки из CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '
            index($0, "## [" v "]") == 1 { hit = 1; next }
            hit && index($0, "## [") == 1 { exit }
            hit { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::В CHANGELOG.md нет раздела «## [$v]»"
            exit 1
          fi
          {
            echo "Версия \`$v\` — сборка macOS-форка. Установка и ограничения: README.md."
            echo
            cat notes.md
          } > body.md

      - name: Релиз
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Яндекс Музыка RS ${GITHUB_REF_NAME#v}" --notes-file body.md

      # Контрольные суммы считаем уже по загруженным файлам: то, что видит пользователь.
      - name: Контрольные суммы
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          {
            echo
            echo "## Контрольные суммы SHA-256"
            echo
            echo "| Файл | SHA-256 |"
            echo "| --- | --- |"
            for f in dist/*; do
              echo "| \`$(basename "$f")\` | \`$(sha256sum "$f" | cut -d' ' -f1)\` |"
            done
          } > sums.md
          cat body.md sums.md > full.md
          gh release edit "$GITHUB_REF_NAME" --notes-file full.md
